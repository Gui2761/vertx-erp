name: CI / CD - Vertyx ERP Pipeline

on:
  push:
    branches: [ main, master, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Django Test Suite & Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tecnolmed_test
          POSTGRES_USER: tecnolmed
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev gcc curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Check
        run: |
          python manage.py check --settings=tecnolmed.test_settings

      - name: Verify Collectstatic (Static Assets)
        run: |
          python manage.py collectstatic --noinput --settings=tecnolmed.test_settings

      - name: Run Test Suite
        continue-on-error: true
        timeout-minutes: 5
        env:
          DATABASE_URL: postgres://tecnolmed:secretpassword@127.0.0.1:5432/tecnolmed_test
        run: |
          python manage.py test --noinput --settings=tecnolmed.test_settings

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: vertyx-erp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Fly.io Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy Application
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error ::FLY_API_TOKEN está vazio nos Secrets do GitHub!"
            exit 1
          fi
          echo "Token presente, executando deploy..."
          flyctl deploy --remote-only -a vertyx-erp --verbose
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ secrets.FLY_API_TOKEN }}
