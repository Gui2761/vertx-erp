{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Acompanhar protocolo · {{ organization.display_name }}</title><link rel="stylesheet" href="{% static 'css/gestao-publica.css' %}"></head><body class="gp-body"><main class="gp-public-wrap"><section class="gp-panel gp-public-panel"><a class="gp-brand" href="{% url 'rh_municipal_public:public_citizen_portal' organization.slug %}"><span class="gp-brand-mark">V</span><span>VERTYX<small>PORTAL DO CIDADÃO</small></span></a><span class="gp-eyebrow">{{ organization.display_name }}</span><h1>Acompanhar protocolo</h1><p>Informe o canal, o protocolo e a chave privada apresentada no envio. A consulta não revela dados sem a chave correta.</p><form method="post" action="{% url 'rh_municipal_public:public_tracking_select' organization.slug %}" class="gp-form">{% csrf_token %}<label class="gp-field"><span>Canal</span><select class="gp-input" name="channel" required>{% for value,label in channels %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label class="gp-field"><span>Número do protocolo</span><input class="gp-input" name="protocolo" maxlength="32" required autocomplete="off"></label><label class="gp-field"><span>Chave de acompanhamento</span><input class="gp-input" type="password" name="chave" maxlength="100" required autocomplete="off"></label><button class="gp-button gp-button-primary" type="submit">Consultar protocolo</button></form></section></main></body></html>
