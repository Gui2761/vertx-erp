<form method="post" action="{{ action }}" class="os-geo-form">{% csrf_token %}<input type="hidden" name="resultado"><input type="hidden" name="latitude"><input type="hidden" name="longitude"><input type="hidden" name="precisao"><button class="btn btn-primary" type="submit">{{ label }}</button><p class="os-geo-message mt-2" aria-live="polite">A localização será solicitada ao clicar. Se não for obtida, a tentativa será registrada.</p><button class="btn btn-outline-secondary os-geo-continue" type="button" hidden>Continuar com localização não obtida</button></form>
