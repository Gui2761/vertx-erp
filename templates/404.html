<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Não Encontrada · VERTYX ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: #0b111d;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card-err {
      background: #111827;
      border: 1px solid #1f293d;
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 540px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.5);
    }
    .icon-badge {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #3b82f6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 18px;
    }
    .badge-pill {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 99px;
      display: inline-block;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    h1 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.55;
      margin-bottom: 24px;
    }
    .btn-action {
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      border: none;
    }
    .btn-primary-action {
      background: #2563eb;
      color: #ffffff;
    }
    .btn-primary-action:hover {
      background: #1d4ed8;
      color: #ffffff;
    }
    .btn-sec-action {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #334155;
    }
    .btn-sec-action:hover {
      color: #ffffff;
      border-color: #64748b;
    }
  </style>
</head>
<body>
  <div class="card-err">
    <div class="icon-badge">
      <i class="bi bi-compass"></i>
    </div>
    <div>
      <span class="badge-pill">
        <i class="bi bi-question-circle me-1"></i> HTTP 404 · Não Encontrado
      </span>
    </div>
    <h1>Página ou Registro Não Encontrado</h1>
    <p>
      O link acessado pode ser de uma venda antiga, caixa já encerrado ou o endereço foi digitado incorretamente.
    </p>

    <div class="d-flex flex-wrap justify-content-center gap-2">
      <a href="/pdv/" class="btn-action btn-primary-action">
        <i class="bi bi-cart3"></i> Ir para o PDV
      </a>
      <a href="/" class="btn-action btn-sec-action">
        <i class="bi bi-house-door"></i> Início
      </a>
    </div>
  </div>
</body>
</html>
