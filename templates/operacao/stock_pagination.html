<nav class="vx-actions mt-3" aria-label="Paginação"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_previous %}<a class="btn btn-outline-primary" href="?page={{ page_obj.previous_page_number }}&q={{ request.GET.q|urlencode }}&peca={{ request.GET.peca|urlencode }}&situacao={{ request.GET.situacao|urlencode }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-outline-primary" href="?page={{ page_obj.next_page_number }}&q={{ request.GET.q|urlencode }}&peca={{ request.GET.peca|urlencode }}&situacao={{ request.GET.situacao|urlencode }}">Próxima</a>{% endif %}</nav>
