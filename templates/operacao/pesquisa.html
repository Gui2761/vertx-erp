{% extends 'base.html' %}{% block title %}Pesquisa global{% endblock %}{% block content %}
<header class="vx-page-header"><h1>Pesquisa global</h1></header><form class="card p-3 mb-3" method="get"><label for="global-query">Cliente, unidade, patrimônio, série, OS, chamado ou contrato</label><div class="d-flex gap-2"><input class="form-control" id="global-query" name="q" value="{{ q }}" maxlength="100" minlength="2"><button class="btn btn-primary">Pesquisar</button></div></form>
{% for section in sections %}<section class="card p-3 mb-3"><h2 class="h5">{{ section.titulo }}</h2>{% for row in section.rows %}<p><a href="{{ row.url }}">{{ row.label }}</a></p>{% empty %}<p>Nenhum resultado autorizado.</p>{% endfor %}</section>{% endfor %}{% endblock %}
