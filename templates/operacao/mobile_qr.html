{% extends 'base.html' %}{% load static %}{% block content %}<main class="container"><h1>Identificar equipamento</h1><p>Use o QR do equipamento ou informe o código UUID. A ficha continua sujeita às permissões da organização.</p><form id="qr-manual" class="card card-body my-3"><label for="qr-code">Código UUID ou URL do QR</label><input class="form-control" id="qr-code" autocomplete="off" required><button class="btn btn-primary my-3">Abrir ficha autorizada</button></form><button class="btn btn-outline-primary" id="qr-camera" type="button">Ativar câmera para ler QR</button><button class="btn btn-outline-secondary" id="qr-stop" type="button">Parar câmera</button><video id="qr-video" class="w-100 mt-3" playsinline muted aria-label="Prévia da câmera para leitura de QR"></video><p id="qr-status" role="status">A câmera só é solicitada ao tocar em Ativar. Há alternativa manual.</p></main><script src="{% static 'mobile-qr.js' %}" defer></script>{% endblock %}
