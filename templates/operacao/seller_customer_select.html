<details class="sv-details" id="seller-customer"><summary>Selecionar / cadastrar cliente</summary><form method="get" class="sv-search"><label class="visually-hidden" for="customer-search">Buscar cliente por nome ou CPF/CNPJ</label><input id="customer-search" name="cliente_q" value="{{ customer_q }}" placeholder="Nome ou CPF/CNPJ"><button class="sv-button">Buscar cliente</button></form><form method="post" class="sv-form">{% csrf_token %}<input name="action" value="cliente" type="hidden"><label for="customer">Cliente da venda</label><select id="customer" name="cliente"><option value="">Venda rápida · sem identificação</option>{% if sale.cliente %}<option value="{{ sale.cliente.pk }}" selected>{{ sale.cliente }}</option>{% endif %}{% for row in customers %}<option value="{{ row.pk }}">{{ row.nome_razao_social }} · {{ row.cpf_cnpj }}</option>{% endfor %}</select><button class="sv-button">Selecionar cliente</button></form>{% if can_customer %}<a class="sv-button" href="{% url 'operacao:seller_customer' %}?venda={{ sale.public_id }}">Cadastrar cliente / informar CPF</a>{% endif %}</details>
