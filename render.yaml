# Atualização local preparada para o Web Service e PostgreSQL já existentes.
# Não declara databases nem provisiona outro PostgreSQL.
# DATABASE_URL/SECRET_KEY/storage usam os valores existentes no serviço.
# sync:false não sobrescreve essas variáveis ao atualizar um Blueprint.
# Não sincronizar/aplicar este arquivo antes da homologação/autorização.

services:
  - type: web
    name: tecnolmed-erp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: UPLOAD_STORAGE
        value: s3
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_REGION_NAME
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: TIME_ZONE
        value: America/Maceio
      - key: DATABASE_URL
        sync: false
