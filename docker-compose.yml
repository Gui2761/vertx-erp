version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tecnolmed}
      POSTGRES_USER: ${POSTGRES_USER:-tecnolmed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD em .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tecnolmed}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py collectstatic --noinput && /bin/sh /app/scripts/start.sh"
    volumes:
      - .:/app
      - media_data:/app/media
      - private_media_data:/app/media_private
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  estoque_runner:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate_locked --noinput && python manage.py processar_estoque --loop"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  private_media_data:
  static_data:
